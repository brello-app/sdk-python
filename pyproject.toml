[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brello-sdk"
version = "0.0.1"
description = "Brello usage tracking for OpenAI, Anthropic, and Google Gen AI Python clients"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Brello", email = "hello@brello.app"}]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]

[project.optional-dependencies]
test = ["httpx>=0.28.1,<1", "openai>=2,<3", "anthropic>=0.60,<1", "google-genai>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brello = ["py.typed"]
